[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Event-driven retraining, evaluation gates, model registry and rollback on real drifting data - all free and local"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.scripts]
mlops = "mlops.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "mlops"
